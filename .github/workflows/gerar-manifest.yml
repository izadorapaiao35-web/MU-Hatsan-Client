name: Gerar manifest automaticamente

on:
  push:
    branches: [ main ]
    paths:
      - 'files/**'
      - '.github/workflows/gerar-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gerar manifest.txt de tudo que estiver em files
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          from urllib.parse import quote

          root = Path('files')
          if not root.exists():
              raise SystemExit('Pasta files nao existe.')

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ.get('GITHUB_REF_NAME', 'main')
          lines = [
              '# MU HATSAN - GERADO AUTOMATICAMENTE. NAO EDITE NA MAO.',
              '# CAMINHO_RELATIVO|URL_DO_ARQUIVO|SHA256',
          ]

          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              encoded = quote(rel, safe='/')
              url = f'https://raw.githubusercontent.com/{repo}/{branch}/files/{encoded}'
              lines.append(f'{rel}|{url}|{sha}')

          Path('manifest.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Manifest gerado com {len(lines)-2} arquivo(s).')

      - name: Salvar manifest se mudou
        shell: bash
        run: |
          if git diff --quiet -- manifest.txt; then
            echo "Manifest ja esta atualizado."
            exit 0
          fi
          git config user.name "MU Hatsan Updater"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.txt
          git commit -m "Atualiza manifest automaticamente [skip ci]"
          git push
